<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Mudcrab schema explorer</title>
<style>
:root{--ink:#182c3b;--muted:#536776;--line:#dbe3e6;--paper:#fff;--bg:#f4f6f5;--blue:#125c80;--tint:#eaf3f7;--amber:#80520c;--amber-bg:#fff6df;--purple:#674b86;--radius:8px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}button,input,select{font:inherit;color:inherit}button{cursor:pointer}a,button,input,select,summary{outline-offset:3px}:focus-visible{outline:3px solid #1682b5}button:disabled{cursor:default}h1,h2,h3,p{margin:0}h1{font-size:25px;line-height:1.25;letter-spacing:-.5px}h2{font-size:16px;line-height:1.35}h3{font-size:12px;text-transform:uppercase;letter-spacing:.055em;margin-bottom:5px;color:var(--muted)}p+p{margin-top:8px}code,.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.94em}code{overflow-wrap:anywhere}pre{font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0 0}small{font-size:12px;color:var(--muted)}.muted{color:var(--muted)}.skip{position:absolute;left:12px;top:-60px;background:white;padding:8px;z-index:9}.skip:focus{top:10px}
.top{min-height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:24px;padding:12px 24px}.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}.brand strong{font-size:20px;letter-spacing:-.5px}.brand span{color:var(--muted)}nav{display:flex;gap:4px;margin-left:auto}nav a{padding:7px 13px;border-radius:6px;font-weight:600;color:var(--muted)}nav a[aria-current=page]{background:var(--tint);color:var(--blue)}.ribbon{display:flex;gap:20px;align-items:center;padding:8px 24px;min-height:43px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}.ribbon strong{color:var(--ink);font-weight:600}.ribbon .scope{margin-left:auto}.app{display:grid;grid-template-columns:290px minmax(0,1fr);height:calc(100dvh - 107px);min-height:350px}.sidebar{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:#fff}.tools{padding:17px 16px 12px;border-bottom:1px solid var(--line)}.search-label{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:650;margin-bottom:7px}.shortcut{color:var(--muted);font-size:11px;font-weight:400}input[type=search],input[type=text],select{width:100%;border:1px solid #cbd6dc;border-radius:6px;background:#fff;padding:8px 10px}input[type=search]{background:#f7f9f9}select{margin-top:9px;font-size:12px;padding:7px 9px}.result-count{font-size:12px;color:var(--muted);padding:11px 16px 8px;display:flex;justify-content:space-between}.clear{border:0;background:none;color:var(--blue);font-size:12px;padding:0}.catalog{overflow-y:auto;padding:0 8px 12px;scrollbar-width:thin;min-height:0;flex:1}.item{display:block;border:1px solid transparent;border-radius:6px;padding:10px 9px;line-height:1.3;margin-bottom:3px;color:var(--ink)}.item:hover{background:#f3f7f8;text-decoration:none}.item[aria-current=true]{background:var(--tint);border-color:#bbd7e4}.item-title{display:flex;align-items:baseline;gap:10px}.item-title code{min-width:44px;font-weight:700;font-size:13px;flex-shrink:0;white-space:nowrap}.item-title .name{font-size:13px;min-width:0}.item small{display:block;font-size:11px;margin-top:4px}.list-empty{padding:20px 9px;color:var(--muted)}.detail{overflow-y:auto;min-width:0;padding:23px 30px 50px;scrollbar-width:thin;scroll-behavior:smooth}.crumb{font-size:12px;color:var(--muted);margin-bottom:9px}.title-row{display:flex;align-items:baseline;gap:13px;flex-wrap:wrap}.subtitle{font-size:19px;color:var(--muted);letter-spacing:-.2px}.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.badge{display:inline-block;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--muted);padding:2px 7px;font-size:11px;line-height:1.5}.badge.blue{background:var(--tint);border-color:#c5dce7;color:var(--blue)}.badge.amber{background:var(--amber-bg);border-color:#e8d49e;color:var(--amber)}.badge.purple{background:#f2eef7;border-color:#ded3ed;color:var(--purple)}.lead{max-width:1000px;margin-top:13px;color:var(--muted)}.section{margin-top:23px}.section>h2{margin-bottom:10px}.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px}.card.warning{background:var(--amber-bg);border-color:#e8d49e}.card.warning h3{color:var(--amber)}.card.planned{border-style:dashed;border-color:#b9a5d0;background:#fcfaff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid>.card{min-width:0}.link-row{display:flex;gap:7px;flex-wrap:wrap}.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #ccdce3;border-radius:5px;padding:5px 8px;font-size:12px}.chip:hover{background:var(--tint);text-decoration:none}.mapping{display:grid;grid-template-columns:185px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.mapping:first-child{padding-top:0}.mapping:last-child{border-bottom:0;padding-bottom:0}.mapping p{font-size:13px}.inline-source{display:inline-block;font-size:11px;margin-top:5px}.field-link{display:flex;gap:11px;align-items:baseline;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}.field-link:hover{border-color:#9cc2d4;text-decoration:none;background:#f9fcfd}.field-link code{min-width:54px;font-weight:650;font-size:12px}.field-link span{font-size:13px}.field-link small{margin-left:auto;white-space:nowrap;font-size:10px}.source-row{display:grid;grid-template-columns:160px minmax(0,1fr);gap:12px;font-size:12px;padding:8px 0;border-bottom:1px solid var(--line)}.source-row:last-child{border-bottom:0}.source-row a{overflow-wrap:anywhere}.source-row .source-kind{color:var(--muted)}details{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:11px 14px;margin-top:10px}summary{font-size:13px;font-weight:600;cursor:pointer}details>p{margin-top:10px}ul{margin:8px 0 0;padding-left:19px}li+li{margin-top:7px}.columns-toolbar{display:flex;gap:12px;align-items:center;margin-bottom:9px}.columns-toolbar label{font-size:12px;font-weight:600;white-space:nowrap}.columns-toolbar input{max-width:330px;font-size:12px;padding:7px 9px}.columns-toolbar small{margin-left:auto}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:var(--muted);font-weight:650;background:#f8fafb;white-space:nowrap}th,td{padding:9px 12px;vertical-align:top;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}td:first-child code{font-size:12px;font-weight:650}.column-table{min-width:710px}.column-table .col-note{min-width:210px;max-width:430px;color:var(--muted)}.column-table .col-name{min-width:170px}.column-table tr.target td{background:#eaf3f7}.column-table td.pk{color:var(--blue);font-weight:650}.relationship{font-size:12px;padding:10px 0;border-bottom:1px solid var(--line)}.relationship:last-child{border:0}.relationship .link-row{gap:5px;align-items:center;margin-bottom:4px}.relationship .chip{padding:3px 6px}.relationship small{display:block;margin-top:3px}.index{padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.index:last-child{border:0}.index .badges{margin:4px 0}.facts{display:grid;grid-template-columns:160px minmax(0,1fr);gap:9px 16px;font-size:12px;margin-top:13px}.facts dt{color:var(--muted)}.facts dd{margin:0;overflow-wrap:anywhere}.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.flow .card{position:relative;font-size:12px;padding:12px}.flow .card h3{color:var(--ink);font-size:12px;text-transform:none;letter-spacing:0;margin-bottom:7px}.flow .card+.card:before{content:"→";position:absolute;left:-10px;top:12px;color:var(--muted);background:var(--bg);font-size:16px}.glossary{display:grid;grid-template-columns:170px minmax(0,1fr);gap:10px 20px;margin:0;font-size:13px}.glossary dt{font-weight:650}.glossary dd{margin:0;color:var(--muted)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.empty{margin-top:20px;max-width:650px}.footnote{font-size:12px;color:var(--muted);margin-top:9px}.noscript{margin:24px;padding:15px;border:1px solid var(--line);background:#fff}
@media(min-width:1600px){.detail{padding-left:40px;padding-right:40px}.app{grid-template-columns:310px minmax(0,1fr)}}
@media(max-width:1100px){.app{grid-template-columns:255px minmax(0,1fr)}.top{padding:10px 18px;gap:15px}.ribbon{padding-left:18px;padding-right:18px;gap:12px}.ribbon .scope{max-width:310px}.detail{padding:20px}.flow{grid-template-columns:repeat(2,minmax(0,1fr))}.mapping{grid-template-columns:160px minmax(0,1fr)}}
@media(max-width:760px){.top{flex-wrap:wrap;gap:8px;padding:12px 14px}.brand{width:100%}.brand strong{font-size:19px}nav{margin:0;gap:3px;width:100%;justify-content:space-between}nav a{padding:6px 9px;font-size:13px}.ribbon{padding:8px 14px;gap:6px 13px;flex-wrap:wrap}.ribbon .scope{margin:0;max-width:none;width:100%}.app{height:auto;display:block;min-height:0}.sidebar{border-right:0;border-bottom:1px solid var(--line)}.tools{padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) 145px;gap:0 8px}.search-label{grid-column:1 / -1}.tools select{margin:0}.result-count{padding:8px 14px}.catalog{max-height:210px;padding:0 8px 8px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px}.item{padding:9px 7px;margin:0}.item-title{display:block}.item-title code{display:block;margin-bottom:3px}.item-title .name{font-size:12px}.detail{overflow:visible;padding:18px 14px 40px;scroll-margin-top:12px}.grid{grid-template-columns:1fr}.title-row{gap:6px 10px}.subtitle{font-size:17px}.mapping{grid-template-columns:1fr;gap:6px}.source-row{grid-template-columns:1fr;gap:3px}.flow{grid-template-columns:1fr}.flow .card+.card:before{display:none}.facts{grid-template-columns:115px minmax(0,1fr);gap:8px}.glossary{grid-template-columns:1fr;gap:5px}.glossary dd{margin-bottom:12px}.columns-toolbar{flex-wrap:wrap;gap:6px}.columns-toolbar input{max-width:none;flex:1}.columns-toolbar small{width:100%;margin:0}.field-link small{white-space:normal}.brand .badge{margin-left:auto}}
@media(prefers-reduced-motion:reduce){.detail{scroll-behavior:auto}}
@media print{.top nav,.sidebar,.ribbon,.columns-toolbar{display:none}.app{display:block;height:auto}.detail{overflow:visible;padding:0}.card,details{break-inside:avoid}a{color:inherit}.top{padding:0 0 15px}}
</style>
</head>
<body>
<a class="skip" href="#detail">Skip to selected item</a>
<header class="top">
  <div class="brand"><strong>Mudcrab</strong><span>Schema explorer</span><span class="badge amber">P0 research</span></div>
  <nav aria-label="Explorer views">
    <a href="#record/REFR" data-view="record">Catalog <small>134</small></a>
    <a href="#table/references" data-view="table">Tables <small>26</small></a>
    <a href="#evidence/REFR.XESP" data-view="evidence">Evidence</a>
    <a href="#guide/dataflow" data-view="guide">Guide &amp; sources</a>
  </nav>
</header>
<div class="ribbon"><span><strong>Target</strong> SE/AE 1.7.104.0</span><span><strong>SQL</strong> v7 · runtime v3–7</span><span><strong>Cache</strong> v3</span><span class="scope">Declarations + selected projections. Full interpretation remains open.</span></div>
<div class="app">
  <aside class="sidebar" aria-label="Search and browse">
    <div class="tools">
      <label class="search-label" for="search"><span id="search-label">Search records</span><span class="shortcut">/ or Ctrl K</span></label>
      <input id="search" type="search" placeholder="Signature, name, field…" autocomplete="off" spellcheck="false" aria-controls="catalog">
      <label class="sr-only" for="filter">Filter current catalog</label>
      <select id="filter" aria-controls="catalog"></select>
    </div>
    <div class="result-count"><span id="count" aria-live="polite"></span><button class="clear" id="clear" type="button" hidden>Clear</button></div>
    <div class="catalog" id="catalog" aria-label="Catalog entries"></div>
  </aside>
  <main class="detail" id="detail" aria-labelledby="detail-title" tabindex="-1"></main>
</div>
<div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
<noscript><div class="noscript">Enable JavaScript to search the embedded offline catalog. Source research is available in candidate-inventory.json, native-field-ledger.md and schema-explorer-re-evidence.json beside this file.</div></noscript>
<script id="schema-data" type="application/json">@@SCHEMA_DATA@@</script>
<script>
'use strict';
(() => {
  const data = JSON.parse(document.getElementById('schema-data').textContent);
  const $ = id => document.getElementById(id);
  const search = $('search'), filter = $('filter'), catalog = $('catalog'), detail = $('detail');
  const state = {view:'record', id:'REFR', query:'', filter:'all', focus:false};
  const fieldsByRecord = id => data.fields.filter(f => f.record === id);
  const recordsById = new Map(data.records.map(r => [r.id,r]));
  const tablesById = new Map(data.tables.map(t => [t.name,t]));
  const evidenceItems = [
    ...data.fields.map(f => ({...f, category:'fields', title:f.label, code:f.record + '/' + f.tag})),
    ...data.variants.map(v => ({...v, category:'variants', title:v.label, code:v.record + '/' + v.tag})),
    ...data.mcp.ledger_findings.map(f => ({...f, category:'findings', title:f.use, code:f.id})),
    ...data.mcp.mcp_lookup_symbols.map(n => ({...n, category:'native', id:'native.' + n.rva, title:n.label, code:n.rva}))
  ];
  const guideItems = [
    {id:'dataflow',title:'Current and planned data flow',text:'RawRecord immutable archive registry canonical resolution winner'},
    {id:'glossary',title:'Glossary',text:JSON.stringify(data.glossary)},
    {id:'sources',title:'Pins and MCP provenance',text:'source commit hash receipts commands versions xEdit Mutagen native'},
    {id:'limits',title:'Coverage and open questions',text:'unknown acceptance P0 corpus denominator field variants applicability'}
  ];
  function node(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
  function add(parent,...children){for(const c of children){if(c!==null && c!==undefined)parent.append(c);}return parent;}
  function paragraph(text,cls=''){return node('p',cls,text);}
  function safeURL(url){try{const u=new URL(url);return u.protocol==='https:' && u.hostname==='github.com' && !u.username && !u.password;}catch{return false;}}
  function external(source,label){if(!source || !safeURL(source.url))return node('span','muted',label || 'Unavailable source');const a=node('a','',label || source.label);a.href=source.url;a.target='_blank';a.rel='noopener noreferrer';a.title=source.pin;return a;}
  function routeLink(view,id,label,cls='chip',column=''){const a=node('a',cls,label);a.href='#'+view+'/'+encodeURIComponent(id)+(column?'/'+encodeURIComponent(column):'');return a;}
  function tableLink(target,label){const [table,column]=target.split('.');return routeLink('table',table,label || target,'chip',column);}
  function badge(text,tone=''){return node('span','badge '+tone,text);}
  function section(title){const s=node('section','section');add(s,node('h2','',title));return add(detail,s);}
  function card(label,text,tone=''){const c=node('div','card '+tone);return add(c,node('h3','',label),paragraph(text));}
  function heading(code,name,crumb){add(detail,node('div','crumb',crumb));const h=node('div','title-row'),title=node('h1','mono',code);title.id='detail-title';title.tabIndex=-1;add(h,title);if(name)add(h,node('span','subtitle',name));add(detail,h);}
  function sources(sources,open=false){const d=node('details');d.open=open;add(d,node('summary','',`Source anchors (${sources.length})`));for(const s of sources){const row=node('div','source-row');add(row,node('span','source-kind',s.source+' @ '+s.pin.slice(0,10)),external(s,s.path+':'+s.line));add(d,row);}return d;}
  function factList(entries){const dl=node('dl','facts');for(const [key,value] of entries)add(dl,node('dt','',key),node('dd','mono',value));return dl;}
  function statusName(status){return {shared:'Shared source declaration','xedit-only':'xEdit-only · applicability unresolved',header:'TES4 file header'}[status];}
  function recordDetail(r){
    heading(r.id,r.name,'Record candidates / '+r.id);
    const badges=node('div','badges');add(badges,badge(statusName(r.status),r.status==='xedit-only'?'amber':'blue'));
    if(fieldsByRecord(r.id).length)add(badges,badge('Selected field pilot'));
    add(detail,badges,paragraph(r.status==='header'?'TES4 is the plugin file header. It is retained separately from the 133 plugin-record candidates.':'Source declarations establish a candidate signature. Newest-SE applicability and full field interpretation remain unaccepted.','lead'));
    const projections=section('Current converter projection');
    if(r.generic_projection){const generic=node('div','card');add(generic,paragraph('A parsed record that survives remap/override/deletion resolution reaches the generic winner export. This does not prove that this candidate occurs in a target plugin.'),add(node('div','link-row section'),routeLink('table','records','records'),routeLink('table','formid_map','formid_map')));add(projections,generic);}
    else add(projections,card('Header metadata','The parser reads plugin metadata and load-order context; TES4 is not a generic records row.'),add(node('div','link-row section'),routeLink('table','plugins','plugins'),routeLink('guide','dataflow','Read the data flow')));
    if(r.mappings.length){const c=node('div','card section');for(const m of r.mappings){const row=node('div','mapping'),text=node('div');add(text,paragraph(m.note),external(m.source,'Pinned projection code'));text.lastChild.className='inline-source';add(row,routeLink('table',m.table,m.table),text);add(c,row);}add(projections,c);}
    else if(r.generic_projection)add(projections,paragraph('No selected typed SQL table mapping is documented for this signature in the current export path.','footnote'));
    const fs=fieldsByRecord(r.id), evidence=section('Selected field and variant evidence');
    if(fs.length){const grid=node('div','grid');for(const f of fs){const a=routeLink('evidence',f.id,'','field-link');add(a,node('code','',f.tag),node('span','',f.label));add(grid,a);}add(evidence,grid,paragraph('This curated sample has no complete field denominator. Other fields remain undocumented here.','footnote'));const variants=data.variants.filter(v=>v.record===r.id);if(variants.length){const links=node('div','link-row section');for(const v of variants)add(links,routeLink('evidence',v.id,v.tag+' variant'));add(evidence,links);}}
    else add(evidence,card('Not yet documented','No curated field/variant evidence rows are present for this signature. Generic payload retention and a typed table mapping do not establish field completeness.'));
    const declarations=section('Pinned source declarations'), c=node('div','card');
    for(const d of r.declarations){const row=node('div','source-row'),left=node('div');add(left,node('strong','',d.link.source),node('div','muted',d.name));const right=node('div');add(right,external(d.link,d.link.path+':'+d.link.line));if(d.groups.length){const groups=node('div','footnote','Direct group join: ');d.groups.forEach((g,i)=>{if(i)groups.append(document.createTextNode(', '));add(groups,external(g,g.label));});add(right,groups);}add(row,left,right);add(c,row);}add(declarations,c);
    if(r.declarations.filter(d=>d.link.source==='mutagen').length>1)add(declarations,paragraph('Multiple Mutagen model objects share this one physical signature. The global inventory has 135 major-record XML objects and 127 unique wire signatures.','footnote'));
    if(r.caveats.length){const warning=node('div','card warning section');add(warning,node('h3','',r.status==='xedit-only'?'Applicability remains open':'Source caveats'));for(const text of r.caveats)add(warning,paragraph(text));add(detail,warning);}
    add(detail,paragraph('Broad release predicates and missing direct group joins require review; source inclusion is not per-release acceptance.','footnote'),routeLink('guide','sources','Pins and release gates'));
  }
  function columnTable(t,selectedColumn){
    const outer=node('div'),toolbar=node('div','columns-toolbar'),input=node('input');input.type='search';input.id='column-search';input.placeholder='Column name or meaning…';input.autocomplete='off';const label=node('label','', 'Find a column');label.htmlFor=input.id;const count=node('small');add(toolbar,label,input,count);
    const wrap=node('div','table-wrap'),table=node('table','column-table'),thead=node('thead'),tr=node('tr');for(const label of ['Column','Type','PK order','Declared NOT NULL','SQL default','Selected meaning'])add(tr,node('th','',label));add(thead,tr);const tbody=node('tbody');add(table,thead,tbody);add(wrap,table);add(outer,toolbar,wrap);
    function fill(){const q=input.value.trim().toLowerCase();tbody.replaceChildren();const visible=t.columns.filter(c=>(c.name+' '+c.note+' '+c.type).toLowerCase().includes(q));count.textContent=visible.length+' / '+t.columns.length+' columns';for(const c of visible){const row=node('tr',c.name===selectedColumn?'target':'');row.id='column-'+t.name+'-'+c.name;add(row,add(node('td','col-name'),tableLink(t.name+'.'+c.name,c.name)),node('td','mono',c.type || '—'),node('td',c.pk_position?'pk':'',c.pk_position?String(c.pk_position):'—'),node('td','',c.declared_not_null?'Yes':'No'),node('td','mono',c.default===null?'—':c.default),node('td','col-note',c.note || ''));add(tbody,row);}if(!visible.length){const row=node('tr'),td=node('td','muted','No matching columns.');td.colSpan=6;add(tbody,add(row,td));}}
    input.addEventListener('input',fill);fill();return outer;
  }
  function tableDetail(t,column){
    heading(t.name,t.label,'Current SQL / '+t.group);
    add(detail,add(node('div','badges'),badge(t.kind==='rtree'?'RTree virtual table':'SQLite table','blue'),badge(t.columns.length+' columns'),badge('0 declared foreign keys'),badge(t.primary_key.length?'PK: '+t.primary_key.join(' + '):t.kind==='rtree'?'RTree module key':'No declared PK')));
    add(detail,paragraph(t.purpose,'lead'),external(t.source,'Pinned create_tables source'));
    const columns=section('Columns and declared constraints');add(columns,columnTable(t,column));
    add(columns,paragraph('PK order is PRAGMA table_info.pk. Declared NOT NULL is its separate notnull flag. INTEGER PRIMARY KEY aliases rowid and auto-assigns an ID on NULL; a rowid-table TEXT PRIMARY KEY can allow NULL. RTree key behavior is module-defined.','footnote'));
    if(t.records.length){const s=section('Record paths that write this projection'),links=node('div','link-row');for(const id of t.records)add(links,routeLink('record',id,id+' · '+recordsById.get(id).name));add(s,links,paragraph('These are code-evidenced export paths with selected fields and conditions; they are not complete record schemas.','footnote'));}
    else if(['records','formid_map','scripts'].includes(t.name)){const s=section('Record path');add(s,paragraph(t.name==='scripts'?'Conditional across record signatures when VMAD parses successfully.':'Generic across parsed, surviving winning records. TES4 file headers are separate.'));}
    const relationships=data.relationships.filter(r=>r.from.startsWith(t.name+'.')||r.to.startsWith(t.name+'.'));
    if(relationships.length){const s=section('Code and semantic relationships'),c=node('div','card');add(c,paragraph('SQLite declares no foreign keys in this table. The links below describe current code or field meaning; SQL does not enforce them.','muted'));for(const r of relationships){const row=node('div','relationship'),links=node('div','link-row');add(links,tableLink(r.from),node('span','muted','→'),tableLink(r.to),badge(r.kind));add(row,links,paragraph(r.note),external(r.source,'Pinned relationship evidence'));row.lastChild.className='inline-source';add(c,row);}add(s,c);}
    const indexes=node('details');add(indexes,node('summary','',`Indexes (${t.indexes.length})`));if(!t.indexes.length)add(indexes,paragraph(t.kind==='rtree'?'RTree uses its module-managed storage; no PRAGMA index_list rows.':'No PRAGMA index_list rows. INTEGER PRIMARY KEY rowid behavior does not require a separate listed index.','muted'));for(const i of t.indexes){const row=node('div','index');add(row,node('code','',i.name),add(node('div','badges'),badge(i.unique?'Unique':'Nonunique'),badge(i.partial?'Partial':'Full'),badge({c:'Explicit CREATE INDEX',u:'UNIQUE autoindex',pk:'PRIMARY KEY autoindex'}[i.origin] || i.origin)),paragraph('Columns: '+i.columns.join(', ')));if(i.sql)add(row,node('pre','',i.sql));add(indexes,row);}add(detail,indexes);
    const ddl=node('details');add(ddl,node('summary','', 'Pinned SQL definition'),node('pre','',t.sql));add(detail,ddl);
    if(t.kind==='rtree')add(detail,paragraph('Three SQLite shadow tables for this RTree are excluded from the 26 logical tables.','footnote'));
  }
  function fieldDetail(f){
    heading(f.record+'/'+f.tag,f.label,'Selected field pilot / '+f.record);
    add(detail,add(node('div','badges'),badge('Source declaration','blue'),badge('Current partial projection'),badge('Static native evidence'),badge('Interpretation open','amber')));
    add(detail,paragraph('Native target: SE/AE 1.7.104.0 · Steam build 24914197. Static reads and stores do not establish runtime effects.','lead'));
    const s=section('Evidence by layer'),grid=node('div','grid');add(grid,card('Pinned source declaration',f.declaration),card('Current converter projection',f.projection),card('Selected native load path',f.native),card('Known unknowns',f.unknown,'warning'));add(s,grid);
    const projected=section('Current SQL destinations'),links=node('div','link-row');f.columns.forEach(c=>add(links,tableLink(c)));add(projected,links,paragraph('A payload destination may retain untyped parsed bytes. It does not preserve original plugin framing.','footnote'));
    const related=node('div','link-row section');add(related,routeLink('record',f.record,f.record+' record'));for(const v of data.variants.filter(v=>v.record===f.record&&v.tag===f.tag))add(related,routeLink('evidence',v.id,'Variant / disagreement'));for(const id of f.mcp_ids)add(related,routeLink('evidence',id,'MCP '+id));add(detail,related,sources(f.sources,true));
    const fromMCP=data.mcp.field_labels.filter(label=>label.record===f.record&&(label.tag===f.tag||f.tag==='XESP'&&label.tag.includes('XESP')||f.tag==='HEADER'&&label.tag.includes('header')));
    if(fromMCP.length){const d=node('details');add(d,node('summary','', 'mudcrab-re label context'));for(const label of fromMCP)add(d,paragraph(label.label+': '+label.shape),paragraph(label.uncertainty,'muted'));add(d,paragraph('Read-only MCP receipts dated '+data.mcp.observed_date_utc+'; limits and exact calls are in Guide & sources.','footnote'));add(detail,d);}
  }
  function variantDetail(v){
    heading(v.record+'/'+v.tag,v.label,'Selected variant evidence');
    add(detail,add(node('div','badges'),badge('Conditional layout / disagreement','blue'),badge('Unresolved','amber')));
    const s=section('Variant evidence'),grid=node('div','grid');add(grid,card('Source descriptions',v.source),card('Static native branch',v.native),card('Acceptance gap',v.unknown,'warning'));add(s,grid,add(node('div','link-row section'),routeLink('evidence',v.record+'.'+v.tag,'Field evidence'),routeLink('record',v.record,'Record candidate')),sources([data.links.ledger],true));
    const exact={...data.links.ledger,line:v.ledger_line,url:data.links.ledger.url.replace(/#L\d+$/,'#L'+v.ledger_line)};add(detail,external(exact,'Variant ledger row '+v.ledger_line));

  function findingDetail(f){

    const provenance=section('Recorded producer evidence'),c=node('div','card');f.provenance.forEach(p=>add(c,paragraph(p)));add(provenance,c);
    const related=data.fields.filter(field=>field.mcp_ids.includes(f.id));if(related.length){const s=section('Related selected fields'),links=node('div','link-row');related.forEach(field=>add(links,routeLink('evidence',field.id,field.record+'/'+field.tag)));add(s,links);}
    add(detail,paragraph('Ledger retrieval refreshes access to an existing finding. It does not rerun its historical producer or qualify a current corpus.','footnote'),routeLink('guide','sources','Exact MCP calls and pins'));
  }
  function nativeDetail(n){
    heading(n.rva,n.label,'MCP native lookup / static context');
    add(detail,add(node('div','badges'),badge('Static native lookup','blue'),badge('No runtime observation','amber')));
    add(detail,card('Name provenance',n.name_source || 'Ghidra-generated function label; no semantic name provenance reported.'),factList([['Address Library ID',String(n.address_library_id)],['Target build','1.7.104.0 / Steam 24914197'],['Executable SHA-256',data.mcp.pins.native_target.exe_sha256],['Queried tool','lookup: '+n.rva]]));
    if(n.callers)add(detail,paragraph('Reported callers: '+n.callers.join(', '),'lead'));
    add(detail,paragraph('Names are fallback labels, not proof of field behavior. RVA is an executable address, never a serialized payload offset. Field claims are limited to the project ledger’s read/store/dispatch observations.','lead'),add(node('div','link-row section'),routeLink('guide','sources','Lookup receipts and source pins'),routeLink('record',n.rva==='0x2b82b0'?'CELL':n.rva==='0x287520'?'STAT':'REFR','Related record pilot')));
  }
  function guideDetail(id){
    if(id==='dataflow'){
      heading('Data flow','Current projections and planned source authority','Guide');
      add(detail,paragraph('The current converter produces a partial winning-record view. The immutable archive and canonical registry are future work; T41/T56 and the full newest-SE interpretation gate remain open.','lead'));
      for(const [key,title] of [['current','Current converter'],['planned','Planned ingestion architecture']]){const s=section(title),flow=node('div','flow');for(const stage of data.dataflow[key]){const c=node('div','card '+(key==='planned'?'planned':''));add(c,badge(key==='planned'?'Planned':'Current source',key==='planned'?'purple':'blue'),node('h3','section',stage.label),paragraph(stage.text));if(stage.path){const source=data.source_files.find(f=>f.path===stage.path).link;add(c,external({...source,line:stage.line,url:source.url.replace(/#L\d+$/,'#L'+stage.line)},'Code anchor'));}add(flow,c);}add(s,flow);}
      add(detail,add(node('div','card warning section'),node('h3','', 'Preservation boundary'),paragraph('Current RawRecord and database blobs retain selected winning values and parsed tags/payloads. They omit byte-exact headers/groups/compression/XXXX framing and complete override/deletion/source-occurrence history. Raw retention is separate from correct interpretation.')),add(node('div','link-row section'),routeLink('guide','glossary','Read the glossary'),external(data.links.plan,'Phase contracts')));
    }else if(id==='glossary'){
      heading('Glossary','','Guide');add(detail,paragraph('Keep source, identity, interpretation and persisted-product terms separate.','lead'));
      const s=section('Terms'),dl=node('dl','glossary card');for(const g of data.glossary)add(dl,node('dt','',g.term),node('dd','',g.meaning));add(s,dl);
    }else if(id==='sources'){
      heading('Pins & provenance','','Guide');add(detail,paragraph('The HTML embeds its data and works offline. Source anchors open pinned public files; MCP ledger/store anchors remain labelled local-only.','lead'));
      const p=section('Project and source-tool pins');add(p,factList([['Current code evidence',data.pins.code],['Observed main in ledger','db3a1dc3ed80795149e3a15a5047f4d313dd3e74'],['xEdit declaration source',data.pins.xedit],['Mutagen declaration source',data.pins.mutagen],['World DB / runtime','7 / accepts 3–7'],['Cell cache','3']]));
      add(p,paragraph('Source-tool commits are distinct from qualified executable/package pins. The existing Mutagen 0.54.4 oracle and xEdit console probe do not qualify this entire source catalog.','footnote'),add(node('div','link-row section'),external(data.links.inventory),external(data.links.ledger),external(data.links.pilot),external(data.links.versions)));
      const native=section('Selected native target');add(native,factList([['Runtime','SE/AE '+data.mcp.pins.native_target.version],['Steam build',data.mcp.pins.native_target.steam_build],['Executable SHA-256',data.mcp.pins.native_target.exe_sha256],['Evidence tier','Static code review; no VM/runtime observation']]));
      const w=data.mcp.mcp_receipts.workbench,mcp=section('Actual read-only mudcrab-re calls');add(mcp,factList([['Observed UTC date',data.mcp.observed_date_utc],['Server / transport',w.server+' / '+w.transport],['Protocol',w.protocol_version],['RE repository commit',w.head],['Command',w.command.join(' ')],['Store (local-only)',w.server_env.MCRAB_STORE],['Tool lock SHA-256',w.tools_lock_sha256],['uv lock SHA-256',w.uv_lock_sha256],['Called tools',w.called_tools.join(', ')] ]));
      add(mcp,paragraph('Read-only ledger_search, ledger_show and lookup calls succeeded. Their sanitized labels are embedded here. No mutation, decompiled bodies or proprietary payload bytes are included.','footnote'));
      const calls=node('details');add(calls,node('summary','', 'Exact recorded tool calls'),node('pre','',JSON.stringify(w.exact_calls,null,2)));add(mcp,calls);
      const receipts=node('details');add(receipts,node('summary','', 'Local receipt timestamps and capture identity'));for(const r of w.receipt_files)add(receipts,paragraph(r.observed_at_utc+' · local-only: '+r.path,'footnote'));add(receipts,paragraph('MCP context capture head: '+data.mcp.pins.mudcrab_evidence_worktree.head_at_capture+'. This differs from the fixed code-evidence pin; it is not a producer hash for historical findings.','footnote'));add(mcp,receipts);
      const gates=node('details');add(gates,node('summary','', 'Source release gates and extraction limits'));for(const g of data.source_gates){const c=node('div','source-row');add(c,external(g.link,g.link.source+' @ '+g.link.pin.slice(0,10)),paragraph(g.fact));add(gates,c);}add(detail,gates);
      const hashes=node('details');add(hashes,node('summary','', 'Pinned code files and input digests'),paragraph(data.hash_normalization,'footnote'));for(const f of data.source_files)add(hashes,external(f.link,f.path),paragraph(f.sha256,'footnote'));for(const [name,digest] of Object.entries(data.input_hashes))add(hashes,paragraph(name+': '+digest,'footnote'));add(detail,hashes);
    }else{
      heading('Coverage & open questions','','Guide');
      add(detail,paragraph('P0 is provisional. There is no accepted full occurrence denominator, active acceptance load order or complete newest-SE field/variant interpretation.','lead'));
      const s=section('What the counts mean'),grid=node('div','grid');add(grid,card('134 source rows','TES4 file header + 127 shared plugin candidates + six xEdit-only applicability candidates. Mutagen has 135 model objects for 127 physical signatures.'),card('26 logical SQL tables','24 ordinary tables + two RTree virtual tables. Six module shadow tables are excluded. All 26 foreign_key_list results are empty.'),card('24 selected fields / 5 variants','REFR/CELL/STAT samples with declaration/current/static/unknown layers. Other candidate fields remain undocumented here.'),card('No 100% acceptance','Typed current projection, source agreement, validator exit zero and static reads do not establish complete interpretation or supported gameplay.','warning'));add(s,grid);
      const open=section('Required evidence remains open'),c=node('div','card'),ul=node('ul');for(const text of ['Accepted official Data/Creation/archive/localization/load-order pins and a full catalog/occurrence denominator.','Source-candidate applicability and complete field/range/variant interpretation, including unused-by-runtime data.','Independent qualified validators and current-game output/time/RSS baselines.','Runtime enable-parent, primitive, cell lighting and static model/LOD consumer behavior.','XESP flag versus unresolved tail bytes; CELL flags/grid-tail widths; STAT defaults and FormVersion-dependent DNAM.','Historical MCP count producers and input manifests: F0006/F0007 are stale, F0012 supersedes F0007, F0008 lacks its converter producer hash, F0009 is unrelated.'])add(ul,node('li','',text));add(c,ul);add(open,c);
      const caveats=node('details');add(caveats,node('summary','', 'Catalog extraction caveats'));const list=node('ul');data.catalog_caveats.forEach(c=>add(list,node('li','',c)));add(caveats,list);add(detail,caveats,add(node('div','link-row section'),routeLink('guide','dataflow','Current / planned boundaries'),external(data.links.plan,'Full phase gates')));
    }
  }
  function currentItems(){if(state.view==='record')return data.records;if(state.view==='table')return data.tables;if(state.view==='evidence')return evidenceItems;return guideItems;}
  function searchable(item){if(state.view==='record')return JSON.stringify(item)+' '+JSON.stringify(fieldsByRecord(item.id));return JSON.stringify(item);}
  function matchesFilter(item){if(state.filter==='all')return true;if(state.view==='record'){if(state.filter==='typed')return item.mappings.length>0;if(state.filter==='pilot')return fieldsByRecord(item.id).length>0;return item.status===state.filter;}if(state.view==='table')return state.filter==='rtree'?item.kind==='rtree':item.group===state.filter;return item.category===state.filter;}
  function visibleItems(){const words=state.query.toLowerCase().trim().split(/\s+/).filter(Boolean);return currentItems().filter(item=>matchesFilter(item)&&words.every(w=>searchable(item).toLowerCase().includes(w)));}
  function itemId(item){return state.view==='table'?item.name:item.id;}
  function listLabel(item){if(state.view==='record')return [item.id,item.name,statusName(item.status)];if(state.view==='table')return ['',item.name,item.label+' · '+item.columns.length+' columns'];if(state.view==='evidence')return [item.code,item.category==='findings'?item.id+' · '+item.kind.replaceAll('_',' '):item.title,{fields:'Selected field',variants:'Variant / disagreement',findings:'MCP finding',native:'Static native lookup'}[item.category]];return ['',item.title,'Guide'];}
  function renderList(){const items=visibleItems();catalog.replaceChildren();$('count').textContent=items.length+' / '+currentItems().length+' entries';$('clear').hidden=!state.query && state.filter==='all';for(const item of items){const [code,name,hint]=listLabel(item),a=routeLink(state.view,itemId(item),'','item'),title=node('div','item-title');if(code)add(title,node('code','',code));add(title,node('span','name',name));add(a,title,node('small','',hint));if(itemId(item)===state.id)a.setAttribute('aria-current','true');add(catalog,a);}if(!items.length)add(catalog,node('div','list-empty','No matches. Clear search or change the filter.'));}
  function setupView(){const names={record:'records',table:'tables and columns',evidence:'field / MCP evidence',guide:'guide'},placeholders={record:'Signature, name, field…',table:'Table, column, meaning…',evidence:'Tag, question, finding ID…',guide:'Term, source, topic…'};$('search-label').textContent='Search '+names[state.view];search.placeholder=placeholders[state.view];filter.replaceChildren();let options=[['all','All entries']];if(state.view==='record')options=[['all','All 134 source rows'],['shared','127 shared candidates'],['xedit-only','6 xEdit-only candidates'],['header','TES4 file header'],['typed','Selected typed SQL paths'],['pilot','REFR / CELL / STAT pilot']];if(state.view==='table')options=[['all','All 26 logical tables'],['rtree','2 RTree virtual tables'],...Array.from(new Set(data.tables.map(t=>t.group))).sort().map(g=>[g,g])];if(state.view==='evidence')options=[['all','All selected evidence'],['fields','24 curated fields'],['variants','5 variant cases'],['findings','9 MCP findings'],['native','4 native lookups']];options.forEach(([value,label])=>{const option=node('option','',label);option.value=value;add(filter,option);});filter.value=state.filter;filter.hidden=state.view==='guide';document.querySelectorAll('nav a').forEach(a=>{if(a.dataset.view===state.view)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});}
  function readRoute(){let parts;try{parts=location.hash.slice(1).split('/').map(decodeURIComponent);}catch{parts=[];}const [view,id,column]=parts;if(!['record','table','evidence','guide'].includes(view))return {view:'record',id:'REFR'};const defaults={record:'REFR',table:'references',evidence:'REFR.XESP',guide:'dataflow'};return {view,id:id || defaults[view],column};}
  function renderRoute(){const route=readRoute(),viewChanged=route.view!==state.view;state.view=route.view;state.id=route.id;if(viewChanged){state.query='';state.filter='all';search.value='';}setupView();renderList();detail.replaceChildren();let found;
    if(state.view==='record'){found=recordsById.get(state.id);if(found)recordDetail(found);}
    else if(state.view==='table'){found=tablesById.get(state.id);if(found)tableDetail(found,route.column);}
    else if(state.view==='evidence'){found=evidenceItems.find(e=>e.id===state.id);if(found){if(found.category==='fields')fieldDetail(found);else if(found.category==='variants')variantDetail(found);else if(found.category==='findings')findingDetail(found);else nativeDetail(found);}}
    else{found=guideItems.find(g=>g.id===state.id);if(found)guideDetail(state.id);}
    if(!found){heading('Item unavailable','','Explorer');add(detail,card('Unknown deep link','This item is not in the embedded catalog. Select an entry or use the view navigation.'));}
    detail.scrollTop=0;document.title=(found?(state.view==='table'?found.name:found.id)+' · ':'')+data.title;$('announcement').textContent=(found?'Selected '+(found.name || found.title || found.label || found.id):'Unknown item')+'. '+state.view+' view.';
    if(state.focus){$('detail-title').focus({preventScroll:true});if(matchMedia('(max-width:760px)').matches)detail.scrollIntoView({block:'start'});state.focus=false;}
    if(route.column && found && state.view==='table'){const target=$('column-'+found.name+'-'+route.column);if(target)target.scrollIntoView({block:'nearest'});}
  }
  search.addEventListener('input',()=>{state.query=search.value;renderList();});
  filter.addEventListener('change',()=>{state.filter=filter.value;renderList();});
  $('clear').addEventListener('click',()=>{state.query='';state.filter='all';search.value='';filter.value='all';renderList();search.focus();});
  catalog.addEventListener('keydown',event=>{if(!['ArrowDown','ArrowUp','Home','End'].includes(event.key))return;const links=Array.from(catalog.querySelectorAll('a.item'));if(!links.length)return;event.preventDefault();const index=links.indexOf(document.activeElement),next=event.key==='Home'?0:event.key==='End'?links.length-1:event.key==='ArrowDown'?Math.min(links.length-1,index+1):Math.max(0,index-1);links[next].focus();});
  document.addEventListener('keydown',event=>{const editing=['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);if((event.key==='/'&&!editing)||((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k')){event.preventDefault();search.focus();search.select();}else if(event.key==='Escape'&&document.activeElement===search){event.preventDefault();search.value='';state.query='';renderList();}});
  document.addEventListener('click',event=>{const a=event.target.closest('a');if(!a)return;const href=a.getAttribute('href');if(href==='#detail'){event.preventDefault();detail.focus({preventScroll:true});detail.scrollIntoView({block:'start'});return;}if(href?.startsWith('#'))state.focus=true;});
  addEventListener('hashchange',()=>{if(location.hash!=='#detail')renderRoute();});
  renderRoute();
})();
