[package]
name = "engine"
version.workspace = true
edition.workspace = true

[dependencies]
shared = { path = "../shared" }
bevy.workspace = true
wgpu = { version = "=29.0.4", default-features = false }
bevy_rapier3d = { version = "0.36.0", default-features = false, features = ["dim3", "debug-render-3d"] }
mlua.workspace = true
rusqlite.workspace = true
rkyv.workspace = true
memmap2.workspace = true
color-eyre.workspace = true
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

# The LOD chunk checks hash every chunk on load. Without `asm`, sha2 0.10 runs its portable
# SHA-256 on aarch64 even where the CPU has the SHA-2 instructions; with it, it detects them at run
# time. `asm` also pulls in `sha2-asm`, which does not build with MSVC, so only Apple Silicon asks.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.20"
converter = { path = "../converter" }
ddsfile = "0.5"
ktx2.workspace = true
