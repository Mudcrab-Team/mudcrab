[package]
name = "engine"
version.workspace = true
edition.workspace = true

[dependencies]
shared = { path = "../shared" }
bevy.workspace = true
wgpu = { version = "=29.0.4", default-features = false }
bevy_rapier3d = { version = "0.36.0", default-features = false, features = ["dim3", "debug-render-3d"] }
mlua.workspace = true
rusqlite.workspace = true
rkyv.workspace = true
memmap2.workspace = true
color-eyre.workspace = true
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png"] }
libc = "0.2"
regex = "1.12"
time = { version = "0.3.55", features = ["formatting"] }
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.23.3", features = ["v4"] }
zip = { version = "6", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.20"
converter = { path = "../converter" }
ddsfile = "0.5"
ktx2.workspace = true
