# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]
# A Tera template to be rendered as the changelog's header.
# See https://keats.github.io/tera/#getting-started
header = """
# 📜 The Elder Scrolls: Mudcrab Changelog\n
*"Hey you, you're finally awake. I've fought mudcrabs more fearsome than you!"*

All notable deeds, shouts, quests, and alterations across Mudcrab are chronicled herein.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
decreed by the Jarls of Skyrim, adhering to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
# A Tera template to be rendered for each release in the changelog.
# See https://keats.github.io/tera/#getting-started
body = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {%- for commit in commits %}
        - {{ commit.message | split(pat="\n") | first | upper_first | trim }}\
            {% if commit.remote.username %} by @{{ commit.remote.username }}{%- endif -%}
            {% if commit.remote.pr_number %} in \
            [#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }}) \
            {%- endif -%}
    {% endfor %}
{% endfor %}

{%- if github.contributors | filter(attribute="is_first_time", value=true) | length != 0 %}
    ### 🛡️ New Adventurers
{%- endif -%}

{% for contributor in github.contributors | filter(attribute="is_first_time", value=true) %}
  * @{{ contributor.username }} made their first contribution to the realm\
    {%- if contributor.pr_number %} in \
      [#{{ contributor.pr_number }}]({{ self::remote_url() }}/pull/{{ contributor.pr_number }}) \
    {%- endif %}
{%- endfor %}\n

{%- if github.contributors | filter(attribute="is_first_time", value=true) | length != 0 %}{% raw %}\n{% endraw -%}{% endif %}

"""
# A Tera template to be rendered as the changelog's footer.
# See https://keats.github.io/tera/#getting-started
footer = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{% for release in releases -%}
    {% if release.version and release.previous and release.previous.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: \
            {{ self::remote_url() }}/compare/{{ release.previous.version }}...{{ release.version }}
    {% elif not release.version and release.previous and release.previous.version -%}
        [unreleased]: {{ self::remote_url() }}/compare/{{ release.previous.version }}...HEAD
    {% endif -%}
{% endfor %}
<!-- generated by git-cliff ~ inscribed by the Greybeards of High Hrothgar -->
"""
# Remove leading and trailing whitespaces from the changelog's body.
trim = true

[git]
tag_pattern = "v?[0-9]+\\.[0-9]+\\.[0-9]+"
skip_tags = "v.*-(alpha|beta|rc).*"
conventional_commits = true
filter_unconventional = false
commit_preprocessors = [
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "" },
]
link_parsers = [
  { pattern = "#(\\d+)", href = "https://github.com/Mudcrab-Team/mudcrab/issues/$1" },
]
# An array of regex based parsers for extracting data from the commit message.
# Assigns commits to groups.
# Optionally sets the commit's scope and can decide to exclude commits from further processing.
commit_parsers = [
  { message = "^feat", group = "Added (Forged in Skyforge)" },
  { message = "^[a|A]dd", group = "Added (Forged in Skyforge)" },
  { message = "^[s|S]upport", group = "Added (Forged in Skyforge)" },
  { message = "^.*: add", group = "Added (Forged in Skyforge)" },
  { message = "^.*: support", group = "Added (Forged in Skyforge)" },
  { message = "^doc", group = "Documentation (Elder Scrolls & Tomes)" },
  { message = "^perf", group = "Performance (Whirlwind Sprint)" },
  { message = "^refactor", group = "Changed (School of Alteration)" },
  { message = "^style", group = "Changed (School of Alteration)" },
  { message = "^revert", group = "Removed (Banished to the Soul Cairn)" },
  { message = "^[r|R]emove", group = "Removed (Banished to the Soul Cairn)" },
  { message = "^.*: remove", group = "Removed (Banished to the Soul Cairn)" },
  { message = "^.*: delete", group = "Removed (Banished to the Soul Cairn)" },
  { message = "^test", group = "Fixed (School of Restoration)" },
  { message = "^fix", group = "Fixed (School of Restoration)" },
  { message = "^.*: fix", group = "Fixed (School of Restoration)" },
  { body = ".*security", group = "Security (Wards & Spellbreaker)" },
  { message = "^chore\\(release\\): prepare for", skip = true },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
  { message = "^chore|^ci", group = "Miscellaneous (Blacksmithing & Camp Tasks)" },
  { message = "^.*", group = "Changed (School of Alteration)" },
]
# Exclude commits that are not matched by any commit parser.
filter_commits = false
# Order releases topologically instead of chronologically.
topo_order = false
# Order of commits in each group/release within the changelog.
# Allowed values: newest, oldest
sort_commits = "newest"
