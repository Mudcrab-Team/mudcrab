name: '⚡ Performance Issue'
description: Report slow frame rates, stuttering, high memory, or conversion bottlenecks
labels: [performance]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a performance issue! Please provide details regarding the bottleneck, hardware specs, and profiling traces if available.
  - type: textarea
    id: problem
    attributes:
      label: Describe the performance issue
      description: What is slow, stuttering, or consuming too much memory/VRAM?
      placeholder: Frame rate drops to 15 FPS when loading into Whiterun...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps or commands to reproduce the performance bottleneck.
      placeholder: |
        1. Run `cargo run --release -p engine`
        2. Walk towards cell (0, 0)...
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware & Environment
      description: CPU, GPU, VRAM, RAM, and OS details.
      placeholder: |
        - CPU: Intel Core i5-1035G1
        - GPU: NVIDIA RTX 3060 12GB / Integrated
        - RAM: 16GB
        - OS: Windows 11 / Linux
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Profiling Traces / Logs / Flamegraphs
      description: Paste any tracy traces, benchmark output, or logs here.
      render: shell
    validations:
      required: false
