name: '🐛 Bug Report'
description: File a bug report to help us improve OpenSkyrim
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this issue! Please provide a concise description of the bug and reproduction steps.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide clear steps or minimal repro instructions.
      placeholder: |
        1. Run `cargo run -p launcher`
        2. Click 'Start Conversion'...
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Messages
      description: Please paste any terminal output, panics, or stack traces here.
      render: shell
    validations:
      required: false
  - type: textarea
    id: system-info
    attributes:
      label: System Info
      description: OS, GPU, Rust version, etc.
      placeholder: |
        - OS: Windows 11 / Linux (Ubuntu 24.04) / macOS
        - GPU: NVIDIA RTX 3070 / AMD Radeon / Intel UHD
        - Rustc: 1.85.0
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - annoyance / cosmetic
        - blocks a specific feature or mod
        - crash / blocks application completely
    validations:
      required: true
