name: run_tests

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  CARGO_INCREMENTAL: '0'
  RUSTUP_TOOLCHAIN: "1.98.1"
  RUSTFLAGS: "-C debuginfo=0"

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.ref_name == 'main' && github.sha || 'anysha' }}
  cancel-in-progress: true

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 0

      - id: filter
        name: Filter changed files
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_BASE_REF:-}" ]; then
            echo "Not in a PR context (i.e., push event)"
            COMPARE_REV="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          else
            echo "In a PR context comparing to the captured base commit"
            : "${PR_BASE_SHA:?Missing pull_request.base.sha}"
            COMPARE_REV="$(git merge-base "$PR_BASE_SHA" "$GITHUB_SHA")"
          fi

          if [ "$COMPARE_REV" = "$GITHUB_SHA" ]; then
            CHANGED_FILES="$(git diff --name-only HEAD~1 "$GITHUB_SHA" 2>/dev/null || git ls-files)"
          else
            CHANGED_FILES="$(git diff --name-only "$COMPARE_REV" "$GITHUB_SHA")"
          fi

          check_pattern() {
            local output_name="$1"
            local pattern="$2"

            if echo "$CHANGED_FILES" | grep -qE "$pattern"; then
              echo "${output_name}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${output_name}=false" >> "$GITHUB_OUTPUT"
            fi
          }

          check_pattern "check_rust" '^(rust-toolchain\.toml|devenv\.nix|Cargo\.lock|Cargo\.toml|.*\.rs|\.cargo/.*|\.github/workflows/.*)$'
          check_pattern "check_scripts" '^(scripts/|docs/research/lod-acceptance-[^/]+/|\.github/workflows/run_tests\.yml$)|\.ps1$'
          check_pattern "check_schema_tools" '^(scripts/schema/|docs/research/dynamic-schema/|crates/converter/src/esm/|crates/shared/src/lib\.rs$|\.github/workflows/run_tests\.yml$)'
          check_pattern "check_enable_observations" '^(scripts/reference-enable-observations\.py|scripts/tests/test_reference_enable_observations\.py|\.github/workflows/run_tests\.yml)$'
          check_pattern "check_z_fighting_audit" '^(scripts/audit-z-fighting\.py|scripts/tests/test_audit_z_fighting\.py|\.github/workflows/run_tests\.yml)$'
          check_pattern "check_native_profiling" '^(scripts/profiling/.*|scripts/tests/test_native_metal_profiling\.py|\.github/workflows/run_tests\.yml)$'
    outputs:
      check_rust: ${{ steps.filter.outputs.check_rust }}
      check_scripts: ${{ steps.filter.outputs.check_scripts }}
      check_schema_tools: ${{ steps.filter.outputs.check_schema_tools }}
      check_enable_observations: ${{ steps.filter.outputs.check_enable_observations }}
      check_z_fighting_audit: ${{ steps.filter.outputs.check_z_fighting_audit }}
      check_native_profiling: ${{ steps.filter.outputs.check_native_profiling }}

  format:
    needs: [orchestrate]
    if: needs.orchestrate.outputs.check_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Install Rustfmt
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt

      - name: Format check
        run: cargo fmt --all -- --check

  scripts:
    needs: [orchestrate]
    if: needs.orchestrate.outputs.check_scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test offline script tooling and PR integration audit
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Test LOD audit and validation-plan tooling
        run: python -m unittest discover -s scripts/lod-performance -p 'test_*.py' -v

      - name: PowerShell scripts with non-ASCII text keep a UTF-8 BOM
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r file; do
            if [ "$(LC_ALL=C tr -d '\0-\177' <"$file" | wc -c)" -gt 0 ] \
              && [ "$(head -c 3 "$file" | od -An -tx1 | tr -d ' \n')" != "efbbbf" ]; then
              echo "::error file=$file::$file contains non-ASCII text but no UTF-8 BOM; Windows PowerShell 5.1 would misread it"
              failed=1
            fi
          done < <(git ls-files '*.ps1')
          exit "$failed"

  schema_tools:
    needs: [orchestrate]
    if: needs.orchestrate.outputs.check_schema_tools == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.13'
          - os: macos-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Test corpus and validator tooling without retail inputs
        run: python -m unittest discover -s scripts/schema -p 'test_*.py' -v

      - name: Test source inventory tooling without retail inputs
        run: python -m unittest discover -s docs/research/dynamic-schema -p 'test_*.py' -v

  enable_observations:
    needs: [orchestrate]
    if: needs.orchestrate.outputs.check_enable_observations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test reference observation input preservation
        run: python3 -m unittest discover -s scripts/tests -p test_reference_enable_observations.py -v

  native_profiling:
    needs: [orchestrate]
    if: needs.orchestrate.outputs.check_native_profiling == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test trace analyzers, camera fixtures and native observer configuration
        run: python3 -m unittest discover -s scripts/tests -p test_native_metal_profiling.py -v

  z_fighting_audit:
    needs: [orchestrate]
    if: needs.orchestrate.outputs.check_z_fighting_audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test static depth-risk audit
        run: python3 -m unittest discover -s scripts/tests -p test_audit_z_fighting.py -v

  clippy:
    needs: [orchestrate]
    if: needs.orchestrate.outputs.check_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy

      - name: Set up mold linker
        uses: rui314/setup-mold@v1

      - name: Setup kache compiler cache
        uses: kunobi-ninja/kache-action@v1

      - name: Clippy check
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    needs: [orchestrate]
    if: needs.orchestrate.outputs.check_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            mesa-vulkan-drivers \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - name: Set up mold linker
        uses: rui314/setup-mold@v1

      - name: Setup kache compiler cache
        uses: kunobi-ninja/kache-action@v1
        with:
          # Clippy and tests produce different artifacts. GitHub cache keys are
          # immutable, so the test build must not compete with Clippy's save.
          cache-key-prefix: kache-test

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Run unit & integration tests
        run: cargo nextest run --workspace --lib --bins --tests --examples --no-fail-fast --no-tests=warn
        env:
          NEXTEST_NO_TESTS: warn

      - name: Test GPU texture encoder on software Vulkan
        run: cargo nextest run --locked --workspace --lib --bins --tests --examples --run-ignored only -E 'test(v210_software_gpu_encodes_and_decodes_color_alpha_normals_and_mips)'
        env:
          WGPU_BACKEND: vulkan

  security:
    needs: [orchestrate]
    if: needs.orchestrate.outputs.check_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit dependencies
        run: >-
          cargo audit
          --ignore RUSTSEC-2026-0194
          --ignore RUSTSEC-2026-0195

  performance:
    needs: [orchestrate]
    if: needs.orchestrate.outputs.check_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - name: Run release performance budgets
        run: cargo test --locked --release -p dummy-content --test performance -- --ignored --nocapture --test-threads=1

  tests_pass:
    needs:
      - orchestrate
      - format
      - scripts
      - schema_tools
      - enable_observations
      - z_fighting_audit
      - native_profiling
      - clippy
      - test
      - security
      - performance
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify overall pipeline status
        run: |
          EXIT_CODE=0

          check_result() {
            local job_name="$1"
            local result="$2"
            echo "* ${job_name}: ${result}"
            if [[ "$result" != "skipped" && "$result" != "success" ]]; then
              EXIT_CODE=1
            fi
          }

          check_result "orchestrate" "$RESULT_ORCHESTRATE"
          check_result "format" "$RESULT_FORMAT"
          check_result "scripts" "$RESULT_SCRIPTS"
          check_result "schema_tools" "$RESULT_SCHEMA_TOOLS"
          check_result "enable_observations" "$RESULT_ENABLE_OBSERVATIONS"
          check_result "z_fighting_audit" "$RESULT_Z_FIGHTING_AUDIT"
          check_result "native_profiling" "$RESULT_NATIVE_PROFILING"
          check_result "clippy" "$RESULT_CLIPPY"
          check_result "test" "$RESULT_TEST"
          check_result "security" "$RESULT_SECURITY"
          check_result "performance" "$RESULT_PERFORMANCE"

          exit $EXIT_CODE
        env:
          RESULT_ORCHESTRATE: ${{ needs.orchestrate.result }}
          RESULT_FORMAT: ${{ needs.format.result }}
          RESULT_SCRIPTS: ${{ needs.scripts.result }}
          RESULT_SCHEMA_TOOLS: ${{ needs.schema_tools.result }}
          RESULT_ENABLE_OBSERVATIONS: ${{ needs.enable_observations.result }}
          RESULT_Z_FIGHTING_AUDIT: ${{ needs.z_fighting_audit.result }}
          RESULT_NATIVE_PROFILING: ${{ needs.native_profiling.result }}
          RESULT_CLIPPY: ${{ needs.clippy.result }}
          RESULT_TEST: ${{ needs.test.result }}
          RESULT_SECURITY: ${{ needs.security.result }}
          RESULT_PERFORMANCE: ${{ needs.performance.result }}
