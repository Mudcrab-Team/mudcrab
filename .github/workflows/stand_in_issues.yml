name: stand_in_issues

on:
  schedule:
    # A GitHub outage must not block a pull request, so this check runs nightly.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Every stand-in marker names an open issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/check_retail_claims.py --check-issues
