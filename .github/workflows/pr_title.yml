name: pr_title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # Lets this job be a required check in the merge queue. The title was already
  # validated on the PR, so the queue run has nothing left to check.
  merge_group:

permissions:
  pull-requests: read

jobs:
  pr_title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commit PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          TYPES='feat|fix|perf|refactor|style|revert|build|docs|test|chore|ci'
          SCOPES='converter|engine|launcher|shared|mo2|dummy-content|ci|scripts|release|deps|nif|converters|streaming|lod-experiment'
          # Allow standard types, optional scope, optional '!' for breaking changes, lowercase start
          REGEX="^(${TYPES})(\((${SCOPES})\))?!?: [a-z].*"
          if [[ ! "$PR_TITLE" =~ $REGEX ]] || [ "${#PR_TITLE}" -gt 72 ]; then
            echo "::error::PR title '$PR_TITLE' must be 'type(scope): description' (lowercase after colon, max 72 chars). See docs/contributing/writing-prs.md."
            exit 1
          fi
